[package]
name = "wish-app"
description = "Genshin Companion: wish counter, character archive and ascension planner, built with GPUI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "genshin-companion"
path = "src/main.rs"

[dependencies]
wish-core.workspace = true
wish-ui.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
chrono = { workspace = true, features = ["clock"] }
# A oneshot channel, so a database write finishes even if its caller goes away.
futures-channel = "0.3.34"
# The image downloader's queue, worked a few at a time.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# Blurred backdrops of the wish art (GPUI already builds it).
image.workspace = true

[dev-dependencies]
# `test-support` enables headless rendering for the screenshot example.
gpui-kit = { workspace = true, features = ["test-support"] }
image.workspace = true
serde_json.workspace = true
tempfile.workspace = true
