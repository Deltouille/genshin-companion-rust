[package]
name = "wish-ui"
description = "Genshin Companion's design system: theme, typeface, icons and shared components."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wish-core.workspace = true
# Dates, written by `format` in each language.
chrono.workspace = true
gpui-kit.workspace = true
# Reads the app's own colours in `theme.json` (its `app` sections).
serde_json.workspace = true

[dev-dependencies]
# `test-support` enables headless rendering for the gallery example.
gpui-kit = { workspace = true, features = ["test-support"] }
image.workspace = true
anyhow.workspace = true
