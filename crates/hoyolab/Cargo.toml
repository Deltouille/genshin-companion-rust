[package]
name = "hoyolab"
description = "A small HoYoLAB client for one Genshin Impact account: its game roles, characters and wish-history authkey. No UI and nothing of the app."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fastrand = "2.5.0"
md-5 = "0.10.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ureq = "3.5.1"
url = "2.5.8"
zeroize = "1.9.1"
