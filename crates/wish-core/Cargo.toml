[package]
name = "wish-core"
description = "Wish history storage, import and statistics. No UI dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
calamine = { version = "0.38.0", features = ["dates"] }
chrono = { workspace = true, features = ["clock", "serde"] }
directories = "6.0.0"
# The interface's texts in each language (`i18n`): plurals and variants live in the translations.
fluent-bundle = "0.16.0"
# Reads the texts' variables, for the tests that check every language against the code.
fluent-syntax = "0.12.0"
hoyolab.workspace = true
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
rust_xlsxwriter = "0.102.0"
serde.workspace = true
serde_json.workspace = true
# The system's language, for the first launch (GPUI already builds it).
sys-locale = "0.3.2"
thiserror.workspace = true
ureq.workspace = true
unic-langid = "0.9.6"
url.workspace = true

[dev-dependencies]
anyhow.workspace = true
tempfile.workspace = true

# The core decodes files and the database: a number cut short, or its sign
# lost, would name another item or count without a word. Convert with
# `try_from`, or allow a cast at its spot with the reason it can't go wrong.
[lints.clippy]
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
