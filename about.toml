# cargo-about's settings (`tools/third-party-licenses.sh`): the licence texts of
# every crate in the app, for the release archives and the Credits page.
#
# The licences a dependency may use: all are compatible with the app's
# GPL-3.0-or-later. A crate under any other (and no other choice) fails the
# generation, and so the CI: check a new licence before adding it here.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# What the release builds, on every system.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
# Only what ends up in the binary; not the app's own crates (they are the app).
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
