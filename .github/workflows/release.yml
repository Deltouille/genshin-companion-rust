name: Release

# Pushing a version tag (`git tag v0.1.0 && git push origin v0.1.0`) builds the
# app for each platform and publishes a GitHub release with the archives.
on:
  push:
    tags: ["v*"]

# Read-only by default: only the last job, which compiles nothing, publishes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # fmt, clippy and the tests on the three systems, and the dependency audit,
  # as for every push: a tag publishes nothing that fails them.
  ci:
    uses: ./.github/workflows/ci.yml
  audit:
    uses: ./.github/workflows/audit.yml

  build:
    needs: [ci, audit]
    strategy:
      fail-fast: false
      matrix:
        include:
          # An older Ubuntu, so the binary runs on older glibc versions too.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GPUI system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev

      # No build cache: a release starts clean, from Cargo.lock alone.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Check the tag matches the version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "wish-app") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: cargo build --release --locked -p wish-app --target ${{ matrix.target }}
      - run: tools/package-release.sh ${{ matrix.target }} "$VERSION"
        shell: bash

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only for the release notes, docs/releases/<tag>.md; nothing runs from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      # The tag's notes file when there is one, then GitHub's list of changes.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=()
          file="$GITHUB_WORKSPACE/docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$file" ]; then
            notes=(--notes-file "$file")
          fi
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Genshin Companion $GITHUB_REF_NAME" \
            "${notes[@]}" \
            --generate-notes
